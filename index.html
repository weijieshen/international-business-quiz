<style>

  }

    color: #fff;
  }

  .reveal {

  }

  .reveal .ans .tag.wrong-tag { background: #fde8ec; color: #c1121f; }

    color: #555;
    font-size: 14px;
    line-height: 1.7;
  }

    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
  }
  .nav-btn {
    padding: 12px 28px;

    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;

  .nav-btn.primary {

  .nav-btn.primary:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(67,97,238,0.3); }
  .nav-btn.secondary {
    background: #e8ecf4;

  }
  .nav-btn.secondary:hover { background: #dce0e8; }
  .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
  .nav-center { display: flex; gap: 8px; }
  .jump-input {
    width: 60px;

    border-radius: 8px;
    text-align: center;
    font-size: 14px;

  .jump-input:focus { outline: none; border-color: #4361ee; }
  .jump-btn {
    padding: 8px 14px;
    border: none;
    background: #e8ecf4;
    border-radius: 8px;

  }
  .jump-btn:hover { background: #dce0e8; }
  .summary-card {

  }

  .summary-card .score {
    font-size: 48px;
    font-weight: 800;

    margin: 10px 0;
  }
  .summary-card .detail { color: #666; font-size: 15px; line-height: 1.8; }
  .summary-card .restart-btn {
    margin-top: 20px;
    padding: 12px 36px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #4361ee, #7209b7);
    color: #fff;
    font-size: 16px;
    cursor: pointer;
  }
  .summary-card .restart-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(67,97,238,0.3); }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (max-width: 600px) {
    .container { padding: 12px; }
    .card { padding: 18px 16px; }
    .q-text { font-size: 15px; }
    .option-btn { padding: 12px 14px; font-size: 14px; }
    .nav-btns { flex-wrap: wrap; justify-content: center; }
    .nav-btn { padding: 10px 20px; font-size: 14px; }

  }
</style>

<div class="container">
  <header>

<script>
// ============================================================
// 数据：60 道单项选择题
// ============================================================
const choiceQuestions = [
  { id: 1,
    question: '下列哪一项最能体现市场全球化的含义？',
    options: [
      { label: 'A', text: '企业把研发部门全部设在母国' },
      { label: 'B', text: '政府提高进口关税以保护本国产业' },
      { label: 'C', text: '不同国家消费者逐渐形成相似需求并购买同类产品' },
      { label: 'D', text: '企业只在本国采购原材料' }
    ], answer: 'C', explanation: '市场全球化强调不同国家市场需求趋同，企业可以面向全球销售相似产品。' },
  { id: 2,
    question: '一国政府强制收回外资企业资产并给予部分补偿，这通常被称为_____。',
    options: [
      { label: 'A', text: '征用' },
      { label: 'B', text: '禁运' },
      { label: 'C', text: '汇率干预' },
      { label: 'D', text: '特许经营' }
    ], answer: 'A', explanation: '政府强制收回外资资产并给予补偿属于征用；若无补偿通常称没收。' },
  { id: 3,
    question: '在跨文化谈判中，如果一方更重视关系、暗示、沉默和场合背景，这更接近_____文化。',
    options: [
      { label: 'A', text: '低语境' },
      { label: 'B', text: '高语境' },
      { label: 'C', text: '个人主义' },
      { label: 'D', text: '短期导向' }
    ], answer: 'B', explanation: '高语境文化依赖关系、背景、暗示和非语言信息，沟通不完全靠字面表达。' },
  { id: 4,
    question: '甲国生产 1 单位咖啡需 4 小时、生产 1 单位芯片需 10 小时；乙国生产 1 单位咖啡需 6 小时、生产 1 单位芯片需 8 小时。根据比较优势理论，合理分工是_____。',
    options: [
      { label: 'A', text: '甲国专门生产咖啡，乙国专门生产芯片' },
      { label: 'B', text: '甲国专门生产芯片，乙国专门生产咖啡' },
      { label: 'C', text: '两国均只生产咖啡' },
      { label: 'D', text: '两国没有任何贸易基础' }
    ], answer: 'A', explanation: '比较机会成本：甲国咖啡机会成本较低，乙国芯片机会成本较低，因此分工对应咖啡与芯片。' },
  { id: 5,
    question: '某国规定"前 5 万台进口空调适用 5% 关税，超过部分适用 25% 关税"，这种政策属于_____。',
    options: [
      { label: 'A', text: '自愿出口限制' },
      { label: 'B', text: '外汇管制' },
      { label: 'C', text: '从量税' },
      { label: 'D', text: '关税配额' }
    ], answer: 'D', explanation: '关税配额是"限额内低税率、超过限额高税率"的两阶段关税安排。' },
  { id: 6,
    question: '出口国政府向本国企业提供低息贷款，使其出口价格明显低于正常竞争水平，进口国可能采取的贸易救济措施是_____。',
    options: [
      { label: 'A', text: '自由贸易区' },
      { label: 'B', text: '最惠国待遇' },
      { label: 'C', text: '反补贴税' },
      { label: 'D', text: '货币互换' }
    ], answer: 'C', explanation: '低息贷款属于出口补贴，进口国可用反补贴税抵消补贴造成的不公平竞争。' },
  { id: 7,
    question: '某企业在海外从零开始购地、建厂、招聘并建立生产体系，这属于_____。',
    options: [
      { label: 'A', text: '证券投资' },
      { label: 'B', text: '特许经营' },
      { label: 'C', text: '绿地投资' },
      { label: 'D', text: '出口代理' }

  { id: 8,
    question: '中国居民赴法国旅游并在当地支付酒店费用，在中国国际收支表中应记入_____。',
    options: [
      { label: 'A', text: '服务贸易借方' },
      { label: 'B', text: '服务贸易贷方' },
      { label: 'C', text: '资本账户贷方' },
      { label: 'D', text: '储备资产增加' }
    ], answer: 'A', explanation: '居民境外旅游消费属于服务进口，对中国而言记入服务贸易借方。' },
  { id: 9,
    question: '在直接标价法下，若 USD/CNY 由 7.10 上升到 7.30，表示_____。',
    options: [
      { label: 'A', text: '人民币贬值，美元升值' },
      { label: 'B', text: '人民币升值，美元贬值' },
      { label: 'C', text: '两国物价不变' },
      { label: 'D', text: '汇率制度由固定变为浮动' }

  { id: 10,
    question: '银行报价 USD/CNY 为 7.1200/7.1280，则点差为_____。',

      { label: 'A', text: '7.1240' },
      { label: 'B', text: '0.8000' },
      { label: 'C', text: '0.0080' },
      { label: 'D', text: '14.2480' }

  { id: 11,
    question: '在直接标价法下，即期汇率为 1 美元=7.20 元人民币，3 个月远期升水 80 点，则远期汇率为_____。',
    options: [
      { label: 'A', text: '7.1920' },
      { label: 'B', text: '7.2080' },
      { label: 'C', text: '7.2800' },
      { label: 'D', text: '7.1200' }

  { id: 12,
    question: '布雷顿森林体系的"双挂钩"是指_____。',
    options: [
      { label: 'A', text: '欧元挂钩美元，美元挂钩石油' },
      { label: 'B', text: '美元挂钩黄金，各国货币挂钩美元' },
      { label: 'C', text: '人民币挂钩欧元，欧元挂钩黄金' },
      { label: 'D', text: '各国货币完全自由浮动' }
    ], answer: 'B', explanation: '布雷顿森林体系的核心是美元与黄金挂钩，其他成员国货币与美元挂钩。' },
  { id: 13,
    question: '某美国企业在日本发行以日元计价的债券，该债券通常属于_____。',
    options: [
      { label: 'A', text: '欧洲债券' },
      { label: 'B', text: '外国债券' },
      { label: 'C', text: '股票期权' },
      { label: 'D', text: '特别提款权' }
    ], answer: 'B', explanation: '一国企业在另一国发行以东道国货币计价的债券属于外国债券。' },
  { id: 14,
    question: '企业同时面临强全球整合压力和强本地响应压力时，理论上最匹配的组织结构是_____。',
    options: [
      { label: 'A', text: '全球矩阵结构' },
      { label: 'B', text: '单一职能结构' },
      { label: 'C', text: '纯国内事业部' },
      { label: 'D', text: '简单直线制' }

  { id: 15,
    question: '下列哪一项最能体现"文化控制"？_____。',
    options: [
      { label: 'A', text: '制定详细报销手册' },
      { label: 'B', text: '只考核销售额结果' },

  { id: 16,
    question: '负责协调国际间货币事务、维持全球汇率稳定的主要国际金融组织是_____。',

      { label: 'A', text: '世界银行' },
      { label: 'B', text: '国际清算银行' },

      { label: 'D', text: '世界贸易组织' }

  { id: 17,
    question: '跨国公司在海外设立全资子公司，通过新建厂房和生产线来进入东道国市场。这种对外直接投资方式被称为_____。',
    options: [
      { label: 'A', text: '绿地投资' },
      { label: 'B', text: '跨国并购' },
      { label: 'C', text: '特许经营' },
      { label: 'D', text: '许可证贸易' }
    ], answer: 'A', explanation: '新建厂房和生产线属于绿地投资，是对外直接投资的重要方式。' },
  { id: 18,
    question: '霍尔将文化分为高语境文化和低语境文化。在低语境文化中，人们日常沟通更倾向于_____。',

      { label: 'A', text: '依赖复杂的社会背景和身份提示' },

  { id: 19,
    question: '一国的国际收支平衡表中，商品和劳务的进出口、投资收益等最基础的交易记录在_____。',

      { label: 'B', text: '金融账户' },
      { label: 'C', text: '净误差与遗漏账户' },
      { label: 'D', text: '经常账户' }

  { id: 20,
    question: '古典贸易理论中，首先提出"绝对优势理论"，主张各国应生产并出口本国劳动生产率绝对高于他国的商品的经济学家是_____。',

// ============================================================
// 应用逻辑
// ============================================================
let currentMode = 'choice';   // 'choice' or 'judge'
let currentIndex = 0;
let answers = { choice: {}, judge: {} };

function getQuestions() {
  return currentMode === 'choice' ? choiceQuestions : judgeQuestions;
}

function getAnswers() {
  return answers[currentMode];
}

function switchTab(mode) {
  currentMode = mode;
  currentIndex = 0;
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', (i === 0 && mode === 'choice') || (i === 1 && mode === 'judge'));
  });
  render();
}

function goToQuestion(index) {
  const qs = getQuestions();
  if (index >= 0 && index < qs.length) {
    currentIndex = index;
    render();
  }
}

function prevQ() { if (currentIndex > 0) { currentIndex--; render(); } }
function nextQ() { if (currentIndex < getQuestions().length - 1) { currentIndex++; render(); } }

function handleChoiceSelect(qId, label) {
  const ans = getAnswers();
  if (ans[qId] !== undefined) return; // already answered
  ans[qId] = label;
  render();
}

function handleJudgeSelect(qId, value) {
  const ans = getAnswers();
  if (ans[qId] !== undefined) return;
  ans[qId] = value;
  render();
}

function handleJump(e) {
  const val = parseInt(e.target.value);
  if (e.key === 'Enter' && !isNaN(val)) {
    goToQuestion(val - 1);
    e.target.value = '';
  }
}

function resetTab() {
  answers[currentMode] = {};
  currentIndex = 0;
  render();
}

// ============================================================
// 渲染
// ============================================================
function render() {
  const qs = getQuestions();
  const ans = getAnswers();
  const total = qs.length;
  const q = qs[currentIndex];
  const app = document.getElementById('app');

  if (!q) { app.innerHTML = ''; return; }

  const answered = ans[q.id] !== undefined;
  const isChoice = currentMode === 'choice';

  // Progress
  const answeredCount = Object.keys(ans).length;
  const pct = Math.round((answeredCount / total) * 100);

  let html = `
    <div class="progress-bar">
      <span class="progress-text">${answeredCount}/${total} 已答</span>
      <div class="progress-track">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>
    </div>
    <div class="card">
      <div class="q-number">第 ${currentIndex + 1} 题 / 共 ${total} 题</div>
      <div class="q-text">${isChoice ? q.question : q.statement}</div>
  `;

  if (isChoice) {
    html += '<div class="options">';
    q.options.forEach(opt => {
      let cls = 'option-btn';
      if (answered) {
        cls += ' disabled';
        if (opt.label === q.answer) cls += ' correct';
        else if (opt.label === ans[q.id] && opt.label !== q.answer) cls += ' wrong';
      }
      html += `<button class="${cls}" onclick="handleChoiceSelect(${q.id}, '${opt.label}')">
        <span class="label">${opt.label}</span>
        <span class="text">${opt.text}</span>
      </button>`;
    });
    html += '</div>';
  } else {
    // Judge mode
    html += '<div class="options">';
    const opts = [
      { label: '√', text: '正确', value: true },
      { label: '×', text: '错误', value: false }
    ];
    opts.forEach(opt => {
      let cls = 'option-btn';
      if (answered) {
        cls += ' disabled';
        if (opt.value === q.answer) cls += ' correct';
        else if (opt.value === ans[q.id] && opt.value !== q.answer) cls += ' wrong';
      }
      html += `<button class="${cls}" onclick="handleJudgeSelect(${q.id}, ${opt.value})">
        <span class="label">${opt.label}</span>
        <span class="text">${opt.text}</span>
      </button>`;
    });
    html += '</div>';
  }

  // Reveal area - show if answered
  if (answered) {
    const isCorrect = ans[q.id] === q.answer;
    let ansDisplay;
    if (isChoice) {
      const correctOpt = q.options.find(o => o.label === q.answer);
      ansDisplay = correctOpt ? `${q.answer}. ${correctOpt.text}` : q.answer;
    } else {
      ansDisplay = q.answer ? '正确（√）' : '错误（×）';
    }
    const tagText = isCorrect ? '✓ 回答正确' : '✗ 回答错误';
    const tagCls = isCorrect ? 'correct-tag' : 'wrong-tag';
    const answerLabel = isChoice ? '正确答案' : '正确答案';

    html += `<div class="reveal">
      <div class="ans"><span class="tag ${tagCls}">${tagText}</span></div>
      <div class="ans">${answerLabel}：${ansDisplay}</div>
      <div class="exp">💡 ${q.explanation}</div>
    </div>`;
  }

  html += '</div>';

  // Navigation
  html += '<div class="nav-btns">';
  html += `<button class="nav-btn secondary" onclick="prevQ()" ${currentIndex === 0 ? 'disabled' : ''}>← 上一题</button>`;
  html += `<div class="nav-center">
    <input class="jump-input" type="number" min="1" max="${total}" placeholder="跳转" onkeydown="handleJump(event)">
  </div>`;
  html += `<button class="nav-btn primary" onclick="nextQ()" ${currentIndex === total - 1 ? 'disabled' : ''}>下一题 →</button>`;
  html += '</div>';

  // Bottom: reset + summary link
  if (answeredCount === total) {
    html += `<div class="card summary-card">
      <h2>🎉 全部答完！</h2>
      <div class="detail">
        <div class="score">${computeScore()}%</div>
        <p>共 ${total} 题，答对 ${computeCorrectCount()} 题，答错 ${total - computeCorrectCount()} 题</p>
      </div>
      <button class="restart-btn" onclick="resetTab()">🔄 重新刷题</button>
    </div>`;
  }

  app.innerHTML = html;
}

function computeCorrectCount() {
  const qs = getQuestions();
  const ans = getAnswers();
  let correct = 0;
  qs.forEach(q => {
    if (ans[q.id] !== undefined && ans[q.id] === q.answer) correct++;
  });
  return correct;
}

function computeScore() {
  const total = getQuestions().length;
  const correct = computeCorrectCount();
  return Math.round((correct / total) * 100);
}

// Initial render
render();
</script>
